<script>
  const storyboardPreloadCache = new Set();

  function preloadStoryboardImage(src) {
    if (!src || storyboardPreloadCache.has(src)) {
      return;
    }

    storyboardPreloadCache.add(src);
    const image = new Image();
    image.decoding = "async";
    image.src = src;
  }

  async function loadStoryboardImages(container) {
    if (container.dataset.source) {
      const response = await fetch(container.dataset.source);
      if (!response.ok) {
        throw new Error(`Could not load ${container.dataset.source}`);
      }
      return response.json();
    }

    return JSON.parse(container.dataset.images || "[]");
  }

  async function initialiseSlideshow(container) {
    container.replaceChildren();
    container.classList.add('is-loading');
    container.setAttribute('aria-busy', 'true');
    const status = document.createElement('p');
    status.className = 'storyboard-status';
    status.textContent = 'Loading storyboard…';
    container.appendChild(status);

    const images = await loadStoryboardImages(container);
    if (!images.length) {
      throw new Error('Storyboard has no images.');
    }
    const leftArrow = container.dataset.left;
    const rightArrow = container.dataset.right;
    let index = 0;
    const slide = document.createElement("img");
    slide.className = "slide";
    slide.loading = "eager";
    slide.decoding = "async";
    slide.fetchPriority = "high";
    container.appendChild(slide);

    const prev = document.createElement("img");
    prev.className = "arrow left";
    prev.loading = "lazy";
    prev.decoding = "async";
    prev.src = leftArrow;

    const next = document.createElement("img");
    next.className = "arrow right";
    next.loading = "lazy";
    next.decoding = "async";
    next.src = rightArrow;

    container.appendChild(prev);
    container.appendChild(next);

    function show(i) {
      index = (i + images.length) % images.length;

      slide.src = images[index];
    }

    slide.addEventListener("load", () => {
      container.classList.remove('is-loading');
      container.setAttribute('aria-busy', 'false');
      status.remove();
      preloadStoryboardImage(images[(index + 1) % images.length]);
      preloadStoryboardImage(images[(index - 1 + images.length) % images.length]);
    });

    slide.addEventListener("error", () => {
      showStoryboardError(container, new Error(`Could not load ${images[index]}`));
    });
 
    prev.onclick = () => show(index - 1);
    next.onclick = () => show(index + 1);

    show(0);
  }

  function showStoryboardError(container, error) {
    console.error(error);
    container.classList.remove('is-loading');
    container.setAttribute('aria-busy', 'false');
    container.replaceChildren();
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'storyboard-retry';
    retry.textContent = 'Storyboard unavailable — try again';
    retry.addEventListener('click', () => initialiseSlideshow(container)
      .catch(nextError => showStoryboardError(container, nextError)));
    container.appendChild(retry);
  }

  document.querySelectorAll('.slideshow').forEach(container => {
    initialiseSlideshow(container).catch(error => showStoryboardError(container, error));
  });
