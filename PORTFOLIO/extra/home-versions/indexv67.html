<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZACKDRAWS.COM</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;600&display=swap" rel="stylesheet" />

  <!-- FAVICON -->
  <link rel="icon" type="image/x-icon" href="/WORK/fp/ok.ico" />

  <!-- EXTENSIONS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
  <link rel="manifest" href="/CSS/manifest.json" />

  <!-- STYLES -->
  <link rel="stylesheet" href="/CSS/animation.css" />
  <link rel="stylesheet" href="/CSS/animation_index.css" />
  <link rel="stylesheet" href="/CSS/horizontal.css" />
  <link rel="stylesheet" href="/CSS/email.css" />
  <link rel="stylesheet" href="/CSS/sidebar.css" />
  <link rel="stylesheet" href="/CSS/sidebar_on_top.css" />
  <link rel="stylesheet" href="/CSS/story_styles_03.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #111;
      color: #eee;
      transform: scale(0.77);
      transform-origin: top left;
      width: 50%;
      font-size: 1.2em;
    }

    h1, h2, h3 {
      font-weight: bold;
    }

    main, section, .video-container {
      margin-left: 200px;
    }

    /* Sidebar */
    nav.sidebar {
      width: 250px;
      background-color: #333;
      position: fixed;
      height: 100%;
      color: #fff;
      padding: 20px;
      font-size: 1.2em;
      font-weight: 700;
      border-right: 2px solid #444;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #sidebar a {
      color: #eee;
      text-decoration: none;
      transition: color 0.3s;
    }

    #sidebar a:hover {
      color: #f44336;
    }

    /* Brutalist Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 20px auto;
    }

    .grid-item img {
      width: 100%;
      height: auto;
      border: 5px solid #111;
      border-radius: 0;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    iframe {
      width: 100%;
      height: 400px;
      border: 0;
    }

    /* Brutalist Buttons */
    .pdf-download {
      color: #fff;
      background-color: #f44336;
      padding: 10px 15px;
      text-decoration: none;
      margin: 10px 0;
      display: inline-block;
      font-weight: 700;
      transition: background-color 0.3s;
    }

    .pdf-download:hover {
      background-color: #ff5722;
    }

    /* Brutalist Sections */
    section {
      padding: 40px 20px;
      background-color: #222;
      border-bottom: 3px solid #444;
      margin-bottom: 40px;
    }

    section h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 20px;
      text-transform: uppercase;
      color: #f44336;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: #fff;
      border-top: 3px solid #444;
    }

    footer a {
      color: #f44336;
      text-decoration: none;
      font-weight: 700;
    }

    footer a:hover {
      color: #fff;
    }

    /* Brutalist Forms */
    .email-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    .email-form label {
      font-size: 1.2em;
    }

    .email-form input, .email-form textarea {
      padding: 10px;
      font-size: 1em;
      border: 2px solid #444;
      background-color: #111;
      color: #fff;
      transition: border-color 0.3s;
    }

    .email-form input:focus, .email-form textarea:focus {
      border-color: #f44336;
    }

    .email-form button {
      padding: 10px 20px;
      background-color: #f44336;
      color: #fff;
      font-size: 1.2em;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .email-form button:hover {
      background-color: #ff5722;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div id="sidebar"></div>
  </nav>

  <script>
    fetch('/CSS/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar').innerHTML = data;
      });
  </script>

  <!-- Storyboard Portfolio -->
  <section id="story">
    <h2>STORYBOARD PORTFOLIO</h2>
    <div class="storyboard-item">
      <h3>Farm Life</h3>
      <a href="/WORK/sb/Storyboard_Sample_Zack_Johnson_01.pdf" target="_blank" class="pdf-download">PDF Copy</a>
      <a href="/WORK/sb/Storyboard_Sample_Zack_Johnson_01.pdf" target="_blank" class="pdf-download">Animatic</a>
      <iframe src="https://speakerdeck.com/player/031ec078333b45ef948e9508d19ec234" allowfullscreen></iframe>
    </div>
    <div class="storyboard-item">
      <h3>Steve and Steven</h3>
      <a href="/WORK/sb/Storyboard_Sample_Zack_Johnson_02.pdf" target="_blank" class="pdf-download">PDF Copy</a>
      <a href="https://player.vimeo.com/video/779439061" target="_blank" class="pdf-download">Animatic</a>
      <iframe src="https://speakerdeck.com/player/383fb4ee39b94ca78df4a56ee3e5fab1?slide=4" allowfullscreen></iframe>
    </div>
    <!-- More items as needed -->
  </section>

  <!-- Animation Section -->
  <section id="animation">
    <h2>ANIMATION</h2>
    <div class="animation-reel-container">
      <div class="main-reel">
        <video controls>
          <source src="/WORK/anp/ANI_00.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

  <!-- Character Design Section -->
  <section id="character-design">
    <h2>CHARACTER DESIGN</h2>
    <div class="grid">
      <div class="grid-item"><a href="/WORK/cd/cd_01.jpg" data-fancybox="gallery"><img src="/WORK/cd/cd_01.jpg" alt="Character Design 1"></a></div>
      <div class="grid-item"><a href="/WORK/cd/cd_02.jpg" data-fancybox="gallery"><img src="/WORK/cd/cd_02.jpg" alt="Character Design 2"></a></div>
      <!-- More items as needed -->
    </div>
  </section>

  <!-- Background Design Section -->
  <section id="background-design">
    <h2>BACKGROUND DESIGN</h2>
    <div class="grid">
      <div class="grid-item"><a href="/WORK/bg/P_02/bg_01.jpg" data-fancybox="gallery"><img src="/WORK/bg/P_02/bg_01.jpg" alt="Background 1"></a></div>
      <!-- More items as needed -->
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>CONTACT ME</h2>
    <form class="email-form" action="https://formspree.io/f/xnnzbarj" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="_replyto" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">SEND</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Zack Johnson. All rights reserved. | <a href="https://github.com/zackdraws/zackdraws.github.io/">Website</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
</body>
</html>
