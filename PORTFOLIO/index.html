<script>
  async function loadFragment(target, source) {
    const response = await fetch(source);
    if (!response.ok) throw new Error(`Could not load ${source}`);

    const template = document.createElement('template');
    template.innerHTML = await response.text();

    template.content.querySelectorAll('img').forEach(image => {
      image.loading = 'lazy';
      image.decoding = 'async';
    });
    template.content.querySelectorAll('video').forEach(video => {
      video.preload = 'none';
    });
    template.content.querySelectorAll('iframe').forEach(frame => {
      frame.loading = 'lazy';
    });

    target.replaceChildren(template.content);
  }

  loadFragment(document.getElementById('sidebar'), 'CSS/sidebar.html')
    .catch(error => console.error(error));
</script>

<script>
  const storyboardPreloadCache = new Set();

  function preloadStoryboardImage(src) {
    if (!src || storyboardPreloadCache.has(src)) {
      return;
    }

    storyboardPreloadCache.add(src);
    const image = new Image();
    image.decoding = "async";
    image.src = src;
  }

  async function loadStoryboardImages(container) {
    if (container.dataset.source) {
      const response = await fetch(container.dataset.source);
      if (!response.ok) {
        throw new Error(`Could not load ${container.dataset.source}`);
      }
      return response.json();
    }

    return JSON.parse(container.dataset.images || "[]");
  }

  async function initialiseSlideshow(container) {
    const images = await loadStoryboardImages(container);
    if (!images.length) {
      return;
    }
    const leftArrow = container.dataset.left;
    const rightArrow = container.dataset.right;
    let index = 0;
    const slide = document.createElement("img");
    slide.className = "slide";
    slide.loading = "eager";
    slide.decoding = "async";
    slide.fetchPriority = "high";
    container.appendChild(slide);

    const prev = document.createElement("img");
    prev.className = "arrow left";
    prev.loading = "lazy";
    prev.decoding = "async";
    prev.src = leftArrow;

    const next = document.createElement("img");
    next.className = "arrow right";
    next.loading = "lazy";
    next.decoding = "async";
    next.src = rightArrow;

    container.appendChild(prev);
    container.appendChild(next);

    function show(i) {
      index = (i + images.length) % images.length;

      slide.src = images[index];
    }

    slide.addEventListener("load", () => {

      preloadStoryboardImage(images[(index + 1) % images.length]);
      preloadStoryboardImage(images[(index - 1 + images.length) % images.length]);
    });
 
    prev.onclick = () => show(index - 1);
    next.onclick = () => show(index + 1);

    show(0);
  }

  document.querySelectorAll('.slideshow').forEach(container => {
    initialiseSlideshow(container).catch(error => console.error(error));
  });
</script>

<script>
  const portfolioFragments = [
    ["animation", "CSS/data/animation.html"],
    ["characterdesign-", "CSS/data/characterdesign-.html"],
    ["backgrounddesign-", "CSS/data/backgrounddesign-.html"],
    ["sketchbook-", "CSS/data/sketchbook-.html"]
  ];

  const loadPortfolioFragments = () => portfolioFragments.forEach(([id, source]) => {
    const target = document.getElementById(id);
    loadFragment(target, source).catch(error => console.error(error));
  });


  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadPortfolioFragments, { timeout: 1200 });
  } else {
    setTimeout(loadPortfolioFragments, 0);
  }
</script>
