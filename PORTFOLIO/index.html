      <h2>Stump storyboard</h2>
      <a href="/WORK/sb/SB_02.pdf" target="_blank" class="pdf-download">PDF Copy</a>
 <!--     <a href="/WORK/sb/SB_02.pdf" target="_blank" class="pdf-download">Animatic</a> -->
      <div class="slideshow" data-source="CSS/data/story-2" data-left="/WORK/fp/icons/prev.png" data-right="/WORK/fp/icons/next.png"></div>
    </article>

    <article class="storyboard-card">
      <h2>Steve and Steven Storyboard</h2>
      <a href="/WORK/sb/SB_03.pdf" target="_blank" class="pdf-download">PDF Copy</a>
      <a href="https://player.vimeo.com/video/779439061" target="_blank" class="pdf-download">Animatic</a>
      <div class="slideshow" data-source="CSS/data/story-3" data-left="/WORK/fp/icons/prev.png" data-right="/WORK/fp/icons/next.png"></div>
    </article>

  </div>

<script>
  const storyboardPreloadCache = new Set();
  const storyboardImageCache = new Map();

  function preloadStoryboardImage(src) {
    if (!src || storyboardPreloadCache.has(src)) {
      return;
    }

    storyboardPreloadCache.add(src);
    const image = new Image();
    image.decoding = "async";
    image.src = src;
    storyboardImageCache.set(src, image);
  }

  async function prepareStoryboardImage(src) {
    let image = storyboardImageCache.get(src);

    if (!image) {
      image = new Image();
      image.decoding = "async";
      image.src = src;
      storyboardImageCache.set(src, image);
    }

    if (image.decode) {
      try {
        await image.decode();
      } catch (error) {
        // Some browsers reject decode() for cached images; the loaded image is still usable.
      }
    } else if (!image.complete) {
      await new Promise(resolve => {
        image.onload = resolve;
        image.onerror = resolve;
      });
    }

    return image.src;
  }

  async function loadStoryboardImages(container) {
    if (container.dataset.source) {
      const response = await fetch(container.dataset.source, { cache: "no-cache" });
      if (!response.ok) {
        throw new Error(`Could not load ${container.dataset.source}`);
      }
      return response.json();
    }

    return JSON.parse(container.dataset.images || "[]");
  }

  document.querySelectorAll(".slideshow").forEach(async container => {
    const images = await loadStoryboardImages(container);
    if (!images.length) {
      return;
    }
    const leftArrow = container.dataset.left;
    const rightArrow = container.dataset.right;
    let index = 0;
    const slide = document.createElement("img");
    slide.className = "slide";
    slide.loading = "eager";
    slide.decoding = "async";
    slide.fetchPriority = "high";
    container.appendChild(slide);

    const prev = document.createElement("img");
    prev.src = leftArrow;
    prev.className = "arrow left";
    prev.loading = "eager";
    prev.decoding = "async";

    const next = document.createElement("img");
    next.src = rightArrow;
    next.className = "arrow right";
    next.loading = "eager";
    next.decoding = "async";

    container.appendChild(prev);
    container.appendChild(next);

    async function show(i) {
      index = (i + images.length) % images.length;
      slide.src = await prepareStoryboardImage(images[index]);
      preloadStoryboardImage(images[(index + 1) % images.length]);
      preloadStoryboardImage(images[(index - 1 + images.length) % images.length]);
    }
 
    prev.onclick = () => show(index - 1);
    next.onclick = () => show(index + 1);

    show(0);
  });
</script>
</section>

</script>
