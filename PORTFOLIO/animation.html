<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZACKDRAWS.COM</title>
  <link rel="icon" type="image/x-icon" href="/WORK/fp/ok.ico">
  <link rel="manifest" href="/CSS/manifest.json">
  <link rel="stylesheet" href="/CSS/bundle.css?v=20260518-blue-buttons">
  <script defer src="/JS/animation-carousel.js"></script>
</head>
<body class="animation-page">
  <nav class="sidebar" aria-label="Primary navigation">
    <div id="sidebar"></div>
  </nav>
  <script>
    fetch('/CSS/sidebar.html', { cache: 'no-cache' })
      .then(response => response.text())
      .then(markup => {
        document.getElementById('sidebar').innerHTML = markup;
      })
      .catch(error => console.error(error));
  </script>

  <main id="animation">
    <div class="animation-reel-container">
      <section class="main-reel animation-main-reel" aria-labelledby="animation-reel-heading">
        <div class="animation-carousel__heading">
          <h2 id="animation-reel-heading">Animation Reel</h2>
        </div>
        <video controls muted preload="metadata" playsinline poster="/WORK/anp/mpv-shot0002.jpg">
          <source src="/WORK/anp/ANI_00.mp4" type="video/mp4">
        </video>
      </section>

      <section class="animation-carousel" id="individual-clips" data-animation-carousel aria-labelledby="individual-clips-heading">
        <div class="animation-carousel__heading">
          <h2 id="individual-clips-heading">Individual Clips</h2>
          <p class="animation-carousel__count" data-clip-count aria-live="polite">1 / 10</p>
        </div>
        <video class="animation-carousel__video" controls preload="none" playsinline>
          <source type="video/mp4">
        </video>
        <iframe class="animation-carousel__embed" data-clip-embed title="Vimeo animation clip" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" hidden></iframe>
        <div class="animation-carousel__controls">
          <button type="button" data-clip-previous aria-label="Previous animation clip">
            <img src="/WORK/fp/icons/prev.png" alt="">
          </button>
          <p data-clip-title aria-live="polite">Deadline - An Opera (thesis film)</p>
          <button type="button" data-clip-next aria-label="Next animation clip">
            <img src="/WORK/fp/icons/next.png" alt="">
          </button>
        </div>
      </section>
    </div>

    <section class="animation-projects" aria-labelledby="animated-projects-heading">
      <h2 id="animated-projects-heading">Animated Projects</h2>
      <div class="animation-projects__grid">
        <article>
          <h3>Deadline - An Opera</h3>
          <iframe loading="lazy" title="Deadline - An Opera" src="https://player.vimeo.com/video/452419199?h=5dd48ddc8f" allow="autoplay; fullscreen; picture-in-picture"></iframe>
        </article>
        <article>
          <h3>Duet</h3>
          <iframe loading="lazy" title="Duet" src="https://player.vimeo.com/video/699854136?h=c93b7359ef" allow="autoplay; fullscreen; picture-in-picture"></iframe>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Zack Johnson. All rights reserved. |
      <a href="https://github.com/zackdraws/zackdraws.github.io/">Website</a>
    </p>
  </footer>
</body>
</html>
