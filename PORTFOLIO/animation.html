<section id="animation">
  <div class="video-container animation-main-reel">
    <h2>Animation Reel</h2>
    <video controls preload="metadata" playsinline width="640" height="360">
      <source src="/WORK/anp/ANI_00.mp4" type="video/mp4">
    </video>
  </div>

  <section class="animation-carousel" id="individual-clips" data-animation-carousel aria-labelledby="individual-clips-heading">
    <div class="animation-carousel__heading">
      <h2 id="individual-clips-heading">Individual Clips</h2>
      <p class="animation-carousel__count" data-clip-count aria-live="polite">1 / 10</p>
    </div>
    <video class="animation-carousel__video" controls preload="metadata" playsinline>
      <source src="/WORK/anp/ANI_01.mp4" type="video/mp4">
    </video>
    <iframe class="animation-carousel__embed" data-clip-embed title="Vimeo animation clip" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" hidden></iframe>
    <div class="animation-carousel__controls">
      <button type="button" data-clip-previous aria-label="Previous animation clip">
        <img src="/WORK/fp/icons/prev.png" alt="">
      </button>
      <p data-clip-title aria-live="polite">Steven and Steven</p>
      <button type="button" data-clip-next aria-label="Next animation clip">
        <img src="/WORK/fp/icons/next.png" alt="">
      </button>
    </div>
  </section>

  <section class="animation-projects" aria-labelledby="animated-projects-heading">
    <h2 id="animated-projects-heading">Animated Projects</h2>
    <div class="video-container">
      <h1>Deadline - An Opera</h1>
      <iframe loading="lazy" title="Deadline - An Opera" src="https://player.vimeo.com/video/452419199?h=da30bb65d2" width="640" height="360" frameborder="0" allowfullscreen></iframe>
      <h1>Duet</h1>
      <iframe loading="lazy" title="Duet" src="https://player.vimeo.com/video/699854136?h=c93b7359ef" width="640" height="360" frameborder="0" allowfullscreen></iframe>
    </div>
  </section>
</section>
