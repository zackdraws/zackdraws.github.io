<style>
  .slideshow { position: relative; }
  .storyboard-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;
    width: 32px;
    height: 32px;
    margin: -16px;
    border: 4px solid rgba(0, 0, 0, 0.18);
    border-top-color: #222;
    border-radius: 50%;
    animation: storyboard-spin 0.7s linear infinite;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .slideshow.is-loading .storyboard-spinner { opacity: 1; }

  @keyframes storyboard-spin {
    to { transform: rotate(360deg); }
  }
</style>

<body class="index-page">
<nav class="sidebar">
<div id="sidebar"></div>
</nav>
<script>
  async function loadFragment(target, source) {
    const response = await fetch(source);
    if (!response.ok) throw new Error(`Could not load ${source}`);

    const template = document.createElement('template');
    template.innerHTML = await response.text();

    template.content.querySelectorAll('img').forEach(image => {
      image.loading = 'lazy';
      image.decoding = 'async';
    });
    template.content.querySelectorAll('video').forEach(video => {
      video.preload = 'none';
    });
    template.content.querySelectorAll('iframe').forEach(frame => {
      frame.loading = 'lazy';
    });

    target.replaceChildren(template.content);
  }

  loadFragment(document.getElementById('sidebar'), 'CSS/sidebar.html')
    .catch(error => console.error(error));
</script>

<section id="sketchbook">
  <div class="storyboard-row">


    <article class="storyboard-card">
      <h2>Steve and Steven Storyboard</h2>
      <a href="/WORK/sb/SB_03.pdf" target="_blank" class="pdf-download">PDF Copy</a>
      <a href="https://player.vimeo.com/video/779439061" target="_blank" class="pdf-download">Animatic</a>
      <div class="slideshow" data-source="CSS/data/story-1" data-left="/WORK/fp/icons/prev.png" data-right="/WORK/fp/icons/next.png"></div>
    </article>

  </div>

<script>
  const storyboardPreloadCache = new Set();

  function preloadStoryboardImage(src) {
    if (!src || storyboardPreloadCache.has(src)) {
      return;
    }

    storyboardPreloadCache.add(src);
    const image = new Image();
    image.decoding = "async";
    image.src = src;
  }

  function storyboardWebpSource(src) {
    return src.replace(/\/([^/]+)\.jpg$/i, '/webp/$1.webp');
  }

  async function loadStoryboardImages(container) {
    if (container.dataset.source) {
      const response = await fetch(container.dataset.source);
      if (!response.ok) {
        throw new Error(`Could not load ${container.dataset.source}`);
      }
      return response.json();
    }

    return JSON.parse(container.dataset.images || "[]");
  }

  async function initialiseSlideshow(container) {
    const images = await loadStoryboardImages(container);
    if (!images.length) {
      return;
    }
    const leftArrow = container.dataset.left;
    const rightArrow = container.dataset.right;
    let index = 0;
    const slide = document.createElement("img");
    slide.className = "slide";
    slide.loading = "eager";
    slide.decoding = "async";
    slide.fetchPriority = "high";
    container.appendChild(slide);

    const spinner = document.createElement('div');
    spinner.className = 'storyboard-spinner';
    spinner.setAttribute('role', 'status');
    spinner.setAttribute('aria-label', 'Loading next storyboard frame');
    container.appendChild(spinner);

    const prev = document.createElement("img");
    prev.src = leftArrow;
    prev.className = "arrow left";
    prev.loading = "lazy";
    prev.decoding = "async";

    const next = document.createElement("img");
    next.src = rightArrow;
    next.className = "arrow right";
    next.loading = "lazy";
    next.decoding = "async";

    container.appendChild(prev);
    container.appendChild(next);

    function show(i) {
      index = (i + images.length) % images.length;
      // Avoid a distracting flash for frames that are already in cache.
      clearTimeout(show.loadingTimer);
      show.loadingTimer = setTimeout(() => container.classList.add('is-loading'), 150);
      slide.dataset.jpegFallback = images[index];
      slide.src = storyboardWebpSource(images[index]);
      preloadStoryboardImage(storyboardWebpSource(images[(index + 1) % images.length]));
      preloadStoryboardImage(storyboardWebpSource(images[(index - 1 + images.length) % images.length]));
    }

    slide.addEventListener('load', () => {
      clearTimeout(show.loadingTimer);
      container.classList.remove('is-loading');
    });

    slide.addEventListener('error', () => {
      // Keep the original JPEGs as a compatibility fallback.
      if (slide.src.toLowerCase().endsWith('.webp') && slide.dataset.jpegFallback) {
        slide.src = slide.dataset.jpegFallback;
        return;
      }
      clearTimeout(show.loadingTimer);
      container.classList.remove('is-loading');
    });
 
    prev.onclick = () => show(index - 1);
    next.onclick = () => show(index + 1);

    document.addEventListener('keydown', event => {
      const target = event.target;
      if (target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"]')) {
        return;
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        show(index - 1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        show(index + 1);
      }
    });

    show(0);
  }

  document.querySelectorAll('.slideshow').forEach(container => {
    initialiseSlideshow(container).catch(error => console.error(error));
  });
</script>
