            <h2>Storyboard Portfolio</h2>
	    
	    <div class="slideshow-container">

    <div class="slides" id="slides">

      <div class="slide">

        <img src="https://via.placeholder.com/728x510/00a651/ffffff?text=Slide+1" alt="Slide 1" />

      </div>

      <div class="slide">

        <img src="https://via.placeholder.com/728x510/fc5185/ffffff?text=Slide+2" alt="Slide 2" />

      </div>

      <div class="slide">

        <img src="https://via.placeholder.com/728x510/fb743e/ffffff?text=Slide+3" alt="Slide 3" />

      </div>

      <div class="slide">

        <img src="https://via.placeholder.com/728x510/f9c80e/000000?text=Slide+4" alt="Slide 4" />

      </div>

    </div>



    <button class="arrow left" onclick="prevSlide()">&#10094;</button>

    <button class="arrow right" onclick="nextSlide()">&#10095;</button>

  </div>



  <script>

    const slides = document.getElementById("slides");

    const totalSlides = slides.children.length;

    let currentIndex = 0;



    function updateSlidePosition() {

      slides.style.transform = `translateX(-${currentIndex * 100}%)`;

    }



    function nextSlide() {

      currentIndex = (currentIndex + 1) % totalSlides;

      updateSlidePosition();

    }



    function prevSlide() {

      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;

      updateSlidePosition();

    }

  </script>



</body>
